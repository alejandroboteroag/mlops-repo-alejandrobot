# Configuracion del analisis en SonarCloud (https://sonarcloud.io)
# Verifique que la organizacion y la clave coincidan con las que muestra SonarCloud al importar el repositorio.
sonar.organization=alejandroboteroag
sonar.projectKey=alejandroboteroag_mlops-repo-alejandrobot
sonar.projectName=mlops-repo-alejandrobot

# Codigo fuente y pruebas
sonar.sources=mlops_pipeline
sonar.tests=tests
sonar.exclusions=mlops_pipeline/artefactos/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Cobertura de pruebas (generada por pytest-cov en GitHub Actions)
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=**/*.ipynb
