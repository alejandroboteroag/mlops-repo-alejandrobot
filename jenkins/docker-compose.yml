# Levanta Jenkins localmente con acceso a Docker (requiere Docker Desktop).
# Uso, desde esta carpeta: docker compose up -d   ->   http://localhost:8080
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home: {}
