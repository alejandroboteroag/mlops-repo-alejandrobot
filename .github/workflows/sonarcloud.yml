name: Pruebas y SonarCloud

on:
  push:
    branches: [developer, certification, master]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pruebas-y-calidad:
    name: Pruebas unitarias y analisis de calidad
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas con cobertura
        run: python -m pytest --cov=mlops_pipeline --cov-report=xml --cov-report=term

      - name: Analisis en SonarCloud
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
